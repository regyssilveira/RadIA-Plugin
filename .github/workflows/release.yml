name: RadIA release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to package
        required: true
        default: v2.2.2
      publish:
        description: Publish or update the GitHub release
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radia-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish
    environment: production
    runs-on:
      - self-hosted
      - Windows
      - X64
      - radia-delphi
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.release_tag || github.ref }}

      - name: Resolve and validate release identity
        shell: powershell
        run: |
          $version = (
            Get-Content -LiteralPath ".\package.json" -Raw |
            ConvertFrom-Json
          ).version
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.release_tag }}"
          }
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match package version $version."
          }
          $tagCommit = git rev-list -n 1 $tag
          if ($LASTEXITCODE -ne 0 -or -not $tagCommit) {
            throw "Release tag does not exist: $tag"
          }
          $headCommit = git rev-parse HEAD
          if ($headCommit -ne $tagCommit) {
            throw "Checked-out revision does not match release tag $tag."
          }
          $installerName = "RadIA-v$version-Setup.exe"
          $downloadUrl = (
            "https://github.com/${{ github.repository }}/releases/" +
            "download/$tag/$installerName"
          )
          "RADIA_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "INSTALLER_NAME=$installerName" >> $env:GITHUB_ENV
          "DOWNLOAD_URL=$downloadUrl" >> $env:GITHUB_ENV

      - name: Install frontend dependencies
        shell: powershell
        run: npm ci

      - name: Run repository gates
        shell: powershell
        run: |
          npm run lint
          npm run test:web
          npm run test:docs
          .\scripts\Test-RadIA.SupportedTargets.ps1

      - name: Prepare a clean distribution directory
        shell: powershell
        run: |
          $distribution = [IO.Path]::GetFullPath(
            (Join-Path $PWD "Output\Distribution")
          )
          $outputRoot = [IO.Path]::GetFullPath(
            (Join-Path $PWD "Output")
          )
          if (-not $distribution.StartsWith(
            $outputRoot,
            [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Distribution directory escaped the output root."
          }
          if (Test-Path -LiteralPath $distribution) {
            Get-ChildItem -LiteralPath $distribution -Force |
              Remove-Item -Recurse -Force
          } else {
            New-Item -ItemType Directory -Path $distribution | Out-Null
          }

      - name: Build internal Delphi 12 and 13 installer inputs
        shell: powershell
        run: |
          .\build.ps1 -DelphiVersion "23.0" -Release -Package
          .\build.ps1 -DelphiVersion "37.0" -Release -Package
          .\build.ps1 -DelphiVersion "37.0" -IDE64 -Release -Package

      - name: Validate package provenance
        shell: powershell
        run: |
          .\scripts\New-RadIA.ReleaseEvidence.ps1 `
            -OutputPath ".\Output\Distribution\ReleaseEvidence.json"

      - name: Build and verify the visual installer
        shell: powershell
        run: |
          .\scripts\New-RadIA.VisualInstaller.ps1 `
            -EvidencePath (
              ".\Output\Distribution\VisualInstallerEvidence.json"
            )
          .\scripts\Test-RadIA.VisualInstaller.ps1 `
            -EvidencePath (
              ".\Output\Distribution\VisualInstallerEvidence.json"
            )

      - name: Create stable release channel
        shell: powershell
        run: |
          .\scripts\New-RadIA.ReleaseChannel.ps1 `
            -InstallerPath ".\Output\Installer\$env:INSTALLER_NAME" `
            -DownloadUrl $env:DOWNLOAD_URL `
            -OutputPath ".\Output\Distribution\stable.json"
          Copy-Item `
            -LiteralPath ".\Output\Installer\$env:INSTALLER_NAME" `
            -Destination ".\Output\Distribution\$env:INSTALLER_NAME"

      - name: Upload distribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: RadIA-${{ env.RADIA_VERSION }}-distribution
          path: Output/Distribution/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: >-
          github.event_name == 'push' ||
          inputs.publish == true
        shell: powershell
        run: |
          $releaseExists = $false
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          }
          if (-not $releaseExists) {
            gh release create `
              $env:RELEASE_TAG `
              --verify-tag `
              --title "RadIA $env:RADIA_VERSION" `
              --generate-notes
          }
          gh release upload `
            $env:RELEASE_TAG `
            ".\Output\Distribution\*" `
            --clobber

