<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rad IA Chat</title>
  <link rel="stylesheet" href="vendor/prism-tomorrow.min.css">
  <script>
    const initialTheme = new URLSearchParams(globalThis.location.search).get('theme');
    const safeInitialTheme = ['light', 'dark'].includes(initialTheme) ? initialTheme : 'light';
    document.documentElement.className = safeInitialTheme + '-theme';

  </script>
  <link rel="stylesheet" href="chat-theme.css">
  <link rel="stylesheet" href="chat.css">
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/prism.min.js"></script>
  <script src="vendor/prism-pascal.min.js"></script>
</head>

<body>
  <script>
    document.body.className = safeInitialTheme + '-theme';
  </script>
  <header id="chat-header">
    <div class="header-left">
      <div class="header-logo" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="12" fill="#007ACC" />
          <path d="M12 6L13.8 10.2L18 12L13.8 13.8L12 18L10.2 13.8L6 12L10.2 10.2L12 6Z" fill="#FFFFFF" />
        </svg>
      </div>
      <span class="header-title" title="RadIA AI Assistant">RadIA</span>
      <output id="execution-route" class="execution-route" aria-live="polite"
        title="Effective route used by the current conversation">
        Effective: Chat | Native provider
      </output>
    </div>
    <div class="header-right">
      <button class="header-action-btn" id="btn-terminal"
        title="Open the integrated terminal. You can also type /terminal"
        aria-label="Open Terminal">
        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <path d="m7 9 3 3-3 3"></path>
          <path d="M13 15h4"></path>
        </svg>
        <span class="btn-label">Terminal</span>
      </button>
      <button class="header-action-btn" id="btn-agent-history"
        title="Review previous agent runs, steps, status, and checkpoints (/agent history)"
        aria-label="Open Agent Run History">
        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M12 7v5l3 2"></path>
          <path d="M7 4 4 7"></path>
        </svg>
        <span class="btn-label">Runs</span>
      </button>
      <button class="header-action-btn" id="btn-clear-chat"
        title="Clear messages from the current chat without deleting other sessions"
        aria-label="Clear Chat">
        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"></path>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
        </svg>
        <span class="btn-label">Clear</span>
      </button>
      <button class="header-action-btn" id="btn-generators"
        title="Open guided generators for models, DTOs, and project content"
        aria-label="Open Generators">
        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="3" x2="9" y2="21"></line>
        </svg>
        <span class="btn-label">Generators</span>
      </button>
      <button class="header-action-btn" id="btn-history"
        title="Show, create, rename, or delete saved chat sessions"
        aria-label="Toggle Chat Sessions" aria-expanded="false" aria-controls="sessions-sidebar">
        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
          <path d="M8 9h8"></path>
          <path d="M8 13h5"></path>
        </svg>
        <span class="btn-label">Chats</span>
      </button>
      <button class="header-action-btn hidden" id="btn-web-login"
        title="Connect or disconnect the web-login session required by this provider"
        aria-label="Connect Web Login">
        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <span class="btn-label">Connect</span>
      </button>
      <button class="header-action-btn" id="btn-settings"
        title="Configure providers, agent execution, consent, CLI, MCP, logs, and diagnostics"
        aria-label="Open Settings">
        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06
              a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09
              A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83
              l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09
              A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83
              l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09
              a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83
              l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
              a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
        <span class="btn-label">Settings</span>
      </button>
    </div>
  </header>

  <div id="main-layout">
    <aside id="sessions-sidebar" class="collapsed" aria-label="Chat sessions">
      <div class="sidebar-header">
        <span>CHATS</span>
        <button id="btn-new-chat-sidebar" title="Create a separate empty chat session"
          aria-label="Create New Chat Session">+</button>
      </div>
      <ul id="sessions-list"></ul>
    </aside>

    <div id="chat-wrapper">
      <main id="chat-container" role="log" aria-label="Conversation"
        aria-live="polite" aria-relevant="additions text">
      </main>
      <div id="chat-scrollbar" aria-hidden="true">
        <div id="chat-scrollbar-thumb"></div>
      </div>

      <footer id="chat-footer">
        <div id="context-bar" class="hidden" aria-live="polite">
          <span id="context-text"></span>
        </div>

        <output id="status-bar" class="hidden" aria-live="polite">
          <span id="status-text"></span>
        </output>

        <div id="composer-shell">
          <div id="prompt-wrapper">
            <div id="prompt-capsule">
              <textarea id="prompt-textarea" aria-label="Message Rad IA"
                title="Describe a task, ask a question, or type / to discover commands. Ctrl+Enter sends"
                placeholder="Ask Rad IA or type / for commands..." rows="1"></textarea>
              <button id="btn-queue-prompt" class="hidden"
                title="Queue this message to run after the current response"
                aria-label="Queue message after current response">
                <span aria-hidden="true">+1</span>
              </button>
              <button id="btn-send-prompt" title="Send message (Ctrl+Enter)" aria-label="Send message">
                <svg class="send-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
            <output id="queued-prompts" class="hidden" aria-live="polite">
              <span id="queued-prompts-text"></span>
              <button id="btn-edit-queued" title="Move the next queued message back to the editor">Edit</button>
              <button id="btn-clear-queued" title="Discard all queued messages">Clear</button>
            </output>
          </div>

          <div id="model-selectors">
            <div class="composer-control-row composer-execution-row"
              aria-label="Execution options">
              <button type="button" class="composer-mode-toggle agent-mode-enabled" id="btn-agent-mode"
                title="Agent mode is on: tools may be used after policy and consent checks"
                aria-label="Mode: Agent" aria-pressed="true">
                <span class="composer-control-label">Mode</span>
                <span class="btn-label">Agent</span>
              </button>
              <div class="selector-wrapper">
                <select id="select-provider" aria-label="AI provider" style="display: none;">
                  <option value="">Provider...</option>
                </select>
                <div class="custom-dropdown-wrapper" id="provider-dropdown-wrapper">
                  <button type="button" class="custom-dropdown-trigger" id="provider-dropdown-trigger"
                    title="Select the AI provider used by native chat requests"
                    aria-label="AI provider" aria-expanded="false"
                    aria-haspopup="listbox" aria-controls="provider-options-list">
                    <span id="provider-dropdown-value">Provider...</span>
                  </button>
                  <div class="custom-dropdown-content" id="provider-dropdown-content">
                    <ul class="custom-dropdown-options" id="provider-options-list"></ul>
                  </div>
                </div>
              </div>
              <div class="selector-wrapper">
                <select id="select-model" aria-label="AI model" style="display: none;">
                  <option value="">Model...</option>
                </select>
                <div class="custom-dropdown-wrapper" id="model-dropdown-wrapper">
                  <button type="button" class="custom-dropdown-trigger" id="model-dropdown-trigger"
                    title="Select a provider model; external CLI executors manage their own model"
                    aria-label="AI model" aria-expanded="false"
                    aria-haspopup="listbox" aria-controls="model-options-list">
                    <span id="model-dropdown-value">Model...</span>
                  </button>
                  <div class="custom-dropdown-content" id="model-dropdown-content">
                    <div class="custom-dropdown-search">
                      <input type="text" id="model-search-input" aria-label="Search AI models"
                        placeholder="Search model..." autocomplete="off">
                    </div>
                    <ul class="custom-dropdown-options" id="model-options-list"></ul>
                  </div>
                </div>
              </div>
              <div class="composer-executor-control composer-effort-control">
                <span class="composer-control-label">Effort</span>
                <select id="select-reasoning-effort" aria-label="Reasoning effort for the next message"
                  title="Choose response depth and latency" hidden>
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                  <option value="xhigh">Extra high</option>
                </select>
                <div class="custom-dropdown-wrapper" id="effort-dropdown-wrapper">
                  <button type="button" class="custom-dropdown-trigger" id="effort-dropdown-trigger"
                    title="Choose response depth and latency" aria-label="Reasoning effort for the next message"
                    aria-expanded="false" aria-haspopup="listbox" aria-controls="effort-options-list">
                    <span id="effort-dropdown-value">Medium</span>
                  </button>
                  <div class="custom-dropdown-content" id="effort-dropdown-content">
                    <ul class="custom-dropdown-options" id="effort-options-list" role="listbox">
                      <li><button type="button" class="custom-dropdown-option" data-effort="low"
                        title="Favor faster responses">Low</button></li>
                      <li><button type="button" class="custom-dropdown-option selected"
                        data-effort="medium" aria-pressed="true"
                        title="Balance response depth and latency">Medium</button></li>
                      <li><button type="button" class="custom-dropdown-option" data-effort="high"
                        title="Favor deeper analysis">High</button></li>
                      <li><button type="button" class="custom-dropdown-option"
                        data-effort="xhigh" title="Use the deepest available analysis">Extra high</button></li>
                    </ul>
                  </div>
                </div>
              </div>
              <button type="button" class="composer-mode-toggle composer-advanced-toggle"
                id="btn-composer-advanced" title="Show executor, session, journey, and scope settings"
                aria-label="Show advanced execution settings" aria-expanded="false"
                aria-controls="composer-advanced-options">
                <span class="btn-label">More</span>
              </button>
            </div>
            <div class="composer-control-row composer-context-row hidden"
              id="composer-advanced-options"
              aria-label="Conversation context options">
              <label class="composer-executor-control" for="select-execution-route">
                <span class="composer-control-label">Executor</span>
                <select id="select-execution-route" aria-label="Executor for the next message">
                  <option value="native">RadIA native</option>
                  <option value="codex">Codex CLI</option>
                  <option value="claude">Claude Code</option>
                  <option value="gemini">Gemini CLI</option>
                  <option value="copilot">GitHub Copilot CLI</option>
                </select>
              </label>
              <button type="button" class="composer-mode-toggle" id="btn-cli-new-session"
                title="Detach the resumed CLI conversation and start fresh on the next request"
                aria-label="Start a new external CLI session" hidden>
                <span class="composer-control-label">CLI</span>
                <span class="btn-label">New session</span>
              </button>
              <button type="button" class="composer-mode-toggle" id="btn-journey-context"
                title="Link or detach the journey shared by chat, terminal, and editor"
                aria-label="Toggle shared journey context">
                <span class="composer-control-label">Journey</span>
                <span class="btn-label">Link</span>
              </button>
              <button type="button" class="composer-mode-toggle" id="btn-execution-scope"
                title="Inspect or override provider, model, executor, and limits by project, session, or request"
                aria-label="Open execution settings scopes">
                <span class="composer-control-label">Settings</span>
                <span class="btn-label">Scope</span>
              </button>
              <output id="composer-route" class="composer-route" aria-live="polite"
                title="Credential and model for the next message">Auth: Native</output>
            </div>
          </div>
        </div>

        <ul id="slash-commands-popup" class="hidden"
          aria-label="Available slash commands"></ul>
      </footer>
    </div>

    <div id="generators-wrapper" class="hidden">
      <main id="generators-container">
        <div class="generator-card">
          <div class="generator-form-group">
            <label for="generator-input">Input (JSON or SQL DDL)</label>
            <textarea id="generator-input"
              placeholder="Paste your raw JSON payload or SQL DDL statements here..." rows="8"></textarea>
          </div>

          <div class="generator-options-row">
            <div class="generator-form-group">
              <label for="generator-input-type">Input Type</label>
              <select id="generator-input-type">
                <option value="json">JSON</option>
                <option value="ddl">SQL DDL</option>
              </select>
            </div>

            <div class="generator-form-group">
              <label for="generator-output-type">Output Pattern</label>
              <select id="generator-output-type">
                <option value="vanilla">Vanilla Class</option>
                <option value="record">Modern Record</option>
                <option value="restjson">REST.Json Serialization</option>
                <option value="aurelius">Aurelius ORM</option>
                <option value="dext">DEXT ORM</option>
              </select>
            </div>
          </div>

          <button id="btn-generate-model" class="btn-primary-gradient"
            title="Generate Delphi model code from the JSON or DDL entered above"
            aria-label="Generate Model">Generate Model</button>
        </div>

        <div class="generator-preview-card hidden" id="generator-preview-card">
          <div class="code-block-container">
            <div class="code-header">
              <span>Generated Delphi Unit</span>
              <div class="code-header-actions">
                <button class="copy-btn" id="btn-copy-generator" title="Copy Code"
                  aria-label="Copy Generated Code">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                  </svg>
                </button>
                <button class="apply-btn" id="btn-insert-generator" title="Insert into Editor"
                  aria-label="Insert Generated Code into Editor">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6"></polyline>
                    <polyline points="8 6 2 12 8 18"></polyline>
                  </svg>
                </button>
              </div>
            </div>
            <pre><code class="language-pascal" id="generator-output-code"></code></pre>
          </div>
        </div>
      </main>
    </div>
  </div>

  <dialog id="execution-scope-dialog" class="execution-scope-dialog"
    aria-labelledby="execution-scope-title">
    <form method="dialog" class="execution-scope-shell">
      <header class="execution-scope-header">
        <div>
          <h2 id="execution-scope-title">Execution settings</h2>
          <p>Override only what this project, chat session, or next request needs.</p>
        </div>
        <button value="close" class="execution-scope-close" title="Close execution settings"
          aria-label="Close execution settings">&times;</button>
      </header>
      <label class="execution-scope-selector" for="execution-scope-kind">
        Save changes for
        <select id="execution-scope-kind">
          <option value="project">Active project</option>
          <option value="session">Current chat session</option>
          <option value="request">Next request only</option>
        </select>
      </label>
      <p class="execution-scope-note" id="execution-scope-note" aria-live="polite"></p>
      <div id="execution-scope-fields" class="execution-scope-fields"></div>
      <footer class="execution-scope-footer">
        <button type="button" id="btn-export-execution-scope"
          title="Export only the selected scope settings to a sanitized JSON file">Export scope...</button>
        <button type="button" id="btn-clear-execution-scope"
          title="Remove every override from the selected scope">Restore all inheritance</button>
        <button value="close" title="Close and keep the displayed execution settings">Done</button>
      </footer>
    </form>
  </dialog>

  <script src="chat-bridge.js"></script>
  <script src="RadIA.UI.AgentDiff.js"></script>
  <script src="RadIA.UI.AgentGit.js"></script>
  <script src="RadIA.UI.AgentDebug.js"></script>
  <script>
    const chatScript = document.createElement('script');
    chatScript.src = 'chat.js?v=' + Date.now();
    document.body.appendChild(chatScript);
  </script>
</body>

</html>
